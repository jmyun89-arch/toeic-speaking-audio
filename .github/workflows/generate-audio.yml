name: Generate free TOEIC audio test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toeic-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free TTS client
        run: python -m pip install 'edge-tts==7.3.1'
      - name: Generate and validate two MP3 files
        run: python scripts/generate_audio.py
      - name: Publish generated audio to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/demo_teamwork_normal.mp3 audio/demo_teamwork_slow.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish TOEIC Speaking test audio"
            git push
          fi
