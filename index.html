<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Speaking · Day 1</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#152b49;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px}header{background:#173d70;color:white;padding:24px;border-radius:18px}h1{font-size:25px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.8;font-size:17px}.sub{opacity:.83;font-size:14px}.card{background:white;padding:19px;border-radius:16px;margin:15px 0;box-shadow:0 3px 15px #152c4710;scroll-margin-top:90px}.card:target{outline:2px solid #3b83d1}.en{font-size:19px;line-height:1.85;white-space:pre-line}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{background:#1758aa;color:white;border:0;padding:12px 16px;border-radius:10px;font-size:15px}button.secondary{background:#476987}button:disabled{background:#aab7c7}.small{font-size:13px;color:#65758a}.sticky{position:sticky;bottom:0;background:#fff;box-shadow:0 -3px 18px #20304022;padding:12px 16px;border-radius:16px 16px 0 0;z-index:5}audio{width:100%;height:42px}.label{font-size:13px;color:#45617c;font-weight:700}nav a{display:inline-block;margin:8px 8px 0 0;color:#bfe0ff} </style></head>
<body><main class="wrap"><header><div class="sub">TOEIC SPEAKING · IM3 → AL</div><h1>DAY 01 · 스크립트 보면서 듣기</h1><div>의견 → 이유 → 예시 → 결과</div><nav><a href="#full">전체 답변</a><a href="#opinion">의견</a><a href="#reason">이유</a><a href="#example">사례</a><a href="#result">결과</a></nav></header>
<div id="lessons"></div><div class="sticky"><div class="label" id="now">재생할 문장과 속도를 선택하세요</div><audio id="player" controls preload="none"></audio><div class="small">아래 재생기는 고정됩니다. 위 스크립트를 스크롤하면서 들을 수 있습니다.</div></div></main>
<script>
const lessons=[
['full','전체 AL 모범답변','I prefer working in a team because it helps me solve problems more effectively. First, team members can share different perspectives, so we can find better solutions. For example, during a project at work, we had trouble organizing our schedule. One coworker suggested a shared calendar, and another divided the tasks by priority. As a result, we finished everything on time. Also, teamwork motivates me when a task becomes stressful. I can ask for feedback instead of spending too much time alone. Of course, working independently is useful for tasks that require concentration. However, for most projects, I believe teamwork leads to better results.'],
['opinion','01 · 의견','I prefer working in a team because it helps me solve problems more effectively.'],
['reason','02 · 이유','First, team members can share different perspectives, so we can find better solutions.'],
['example','03 · 사례','For example, during a project at work, we had trouble organizing our schedule. One coworker suggested a shared calendar, and another divided the tasks by priority.'],
['result','04 · 결과','As a result, we finished everything on time.']];
const holder=document.getElementById('lessons'),player=document.getElementById('player'),now=document.getElementById('now');
for(const [id,title,script] of lessons){const section=document.createElement('section');section.className='card';section.id=id;const heading=document.createElement('h2');heading.textContent=title;section.appendChild(heading);const para=document.createElement('p');para.className='en';para.textContent=script;section.appendChild(para);const buttons=document.createElement('div');buttons.className='buttons';for(const [speed,label] of [['normal','▶ 정상 속도'],['slow','▶ 느린 속도']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>{player.src='audio/day01_'+id+'_'+speed+'.mp3';now.textContent=title+' · '+(speed==='normal'?'정상 속도':'느린 속도');player.play().catch(()=>{now.textContent='브라우저의 재생 버튼을 눌러 주세요';});};buttons.appendChild(btn);}section.appendChild(buttons);holder.appendChild(section);}
</script></body></html>
